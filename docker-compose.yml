version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cosmetic-postgres
    environment:
      POSTGRES_DB: cosmetic_db
      POSTGRES_USER: cosmetic_user
      POSTGRES_PASSWORD: cosmetic_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    container_name: cosmetic_backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cosmetic_db
      SPRING_DATASOURCE_USERNAME: cosmetic_user
      SPRING_DATASOURCE_PASSWORD: cosmetic_password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      - postgres

volumes:
  postgres_data: