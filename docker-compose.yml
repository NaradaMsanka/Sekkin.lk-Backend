version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cosmetic-postgres
    environment:
      POSTGRES_DB: cosmetic_db
      POSTGRES_USER: cosmetic_user
      POSTGRES_PASSWORD: cosmetic_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    container_name: cosmetic_backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cosmetic_db
      SPRING_DATASOURCE_USERNAME: cosmetic_user
      SPRING_DATASOURCE_PASSWORD: cosmetic_password
      JWT_SECRET: ${JWT_SECRET:?Set a private JWT_SECRET of at least 32 bytes before starting Compose}
      CHECKOUT_ENABLED: ${CHECKOUT_ENABLED:-false}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${JPA_DDL_AUTO:-validate}
      PASSWORD_RESET_ENABLED: ${PASSWORD_RESET_ENABLED:-false}
      PASSWORD_RESET_FRONTEND_URL: ${PASSWORD_RESET_FRONTEND_URL:-https://www.sekkin.lk}
      PASSWORD_RESET_FROM: ${PASSWORD_RESET_FROM:-no-reply@sekkin.lk}
      SMTP_HOST: ${SMTP_HOST:-smtp.resend.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-resend}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_CONNECTION_TIMEOUT_MS: ${SMTP_CONNECTION_TIMEOUT_MS:-5000}
      SMTP_READ_TIMEOUT_MS: ${SMTP_READ_TIMEOUT_MS:-5000}
      SMTP_WRITE_TIMEOUT_MS: ${SMTP_WRITE_TIMEOUT_MS:-5000}
    depends_on:
      - postgres

volumes:
  postgres_data:
