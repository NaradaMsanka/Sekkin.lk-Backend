name: Full-Stack CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # 1. Run Backend Tests (Java 21 + MySQL 8.0)
  backend-test:
    name: 1. Run Backend Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: cosmetic_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Backend Tests
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/cosmetic_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root
        run: |
          POM_FILE=$(find . -maxdepth 2 -name "pom.xml" | head -n 1)
          echo "Using POM file at: $POM_FILE"
          mvn -f "$POM_FILE" clean test

  # 2. Build React Frontend
  frontend-build:
    name: 2. Build React Frontend
    needs: backend-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies and Build React
        run: |
          PKG_FILE=$(find . -maxdepth 3 -name "package.json" -not -path "*/node_modules/*" | head -n 1)
          if [ -n "$PKG_FILE" ]; then
            FRONTEND_DIR=$(dirname "$PKG_FILE")
            echo "Building React app in: $FRONTEND_DIR"
            cd "$FRONTEND_DIR"
            npm install
            npm run build
          else
            echo "No package.json found in this repository, skipping frontend build."
          fi

  # 3. Build Docker Image
  docker-build:
    name: 3. Build Docker Image
    needs: frontend-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        run: |
          DOCKER_FILE=$(find . -maxdepth 2 -name "Dockerfile" | head -n 1)
          DOCKER_DIR=$(dirname "$DOCKER_FILE")
          echo "Building Docker image from: $DOCKER_DIR"
          docker build -t cosmetic-ecommerce-backend:latest "$DOCKER_DIR"