name: Full-Stack CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # 1. Run Backend Tests (Java 21 + disposable PostgreSQL)
  backend-test:
    name: 1. Run Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sekkin_release_test
          POSTGRES_USER: sekkin_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U sekkin_test -d sekkin_release_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Mark disposable PostgreSQL database
        run: |
          docker exec "${{ job.services.postgres.id }}" psql -U sekkin_test -d sekkin_release_test \
            -c "COMMENT ON DATABASE sekkin_release_test IS 'SEKKIN_DISPOSABLE_RELEASE_VERIFICATION';"

      - name: Run Backend Tests
        env:
          SEKKIN_RUN_POSTGRES_TESTS: 'true'
          SEKKIN_POSTGRES_TEST_URL: jdbc:postgresql://127.0.0.1:5432/sekkin_release_test
        run: |
          mvn -B clean test

  # 2. Build React Frontend
  frontend-build:
    name: 2. Build React Frontend
    needs: backend-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies and Build React
        run: |
          PKG_FILE=$(find . -maxdepth 3 -name "package.json" -not -path "*/node_modules/*" | head -n 1)
          if [ -n "$PKG_FILE" ]; then
            FRONTEND_DIR=$(dirname "$PKG_FILE")
            echo "Building React app in: $FRONTEND_DIR"
            cd "$FRONTEND_DIR"
            npm install
            npm run build
          else
            echo "No package.json found in this repository, skipping frontend build."
          fi

  # 3. Build Docker Image
  docker-build:
    name: 3. Build Docker Image
    needs: frontend-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        run: |
          DOCKER_FILE=$(find . -maxdepth 2 -name "Dockerfile" | head -n 1)
          DOCKER_DIR=$(dirname "$DOCKER_FILE")
          echo "Building Docker image from: $DOCKER_DIR"
          docker build -t cosmetic-ecommerce-backend:latest "$DOCKER_DIR"
