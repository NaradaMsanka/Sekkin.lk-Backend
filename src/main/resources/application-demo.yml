# Explicit submission demo. The environment guard runs before database startup.
spring:
  datasource:
    url: jdbc:h2:mem:sekkin_demo;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: false

server:
  address: 127.0.0.1
  port: 8080

app:
  checkout:
    enabled: true
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173

# The demo uses supplied image URLs; Cloudinary uploads need separate credentials.
cloudinary:
  cloud-name: ""
  api-key: ""
  api-secret: ""
