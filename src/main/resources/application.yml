cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

server:
  port: 8080

spring:
  application:
    name: cosmetic-ecommerce
  datasource:
    url: jdbc:postgresql://localhost:5432/cosmetic_db
    username: cosmetic_user
    password: cosmetic_password
    driver-class-name: org.postgresql.Driver
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 30MB
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
